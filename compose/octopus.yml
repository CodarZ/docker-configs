services:
  octopus:
    image: bestrui/octopus:latest
    container_name: octopus
    restart: always
    ports:
      - "58190:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/docker/octopus/data:/app/data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - default

networks:
  default:
    external: true
    name: network_default
