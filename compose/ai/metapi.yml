services:
  metapi:
    image: 1467078763/metapi:latest
    container_name: metapi
    restart: always
    ports:
      - "58192:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/docker/metapi/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - AUTH_TOKEN=change-me-admin-token # 需要改变
      - PROXY_TOKEN=change-me-proxy-sk-token # 需要改变
      - DATA_DIR=/app/data
    networks:
      - default

networks:
  default:
    external: true
    name: network_default
