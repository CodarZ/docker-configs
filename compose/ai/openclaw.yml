services:
  # 网关
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    init: true
    ports:
      - "58189:18789" # Web UI
      - "58179:18790" # Bridge 端口
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
    volumes:
      - /home/ubuntu/docker/openclaw/config:/home/node/.openclaw
      - /home/ubuntu/docker/openclaw/workspace:/home/node/.openclaw/workspace
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    
    networks:
      - network_default
      
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5

  # 工具
  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-cli
    profiles: ["cli"]
    network_mode: "service:openclaw-gateway" # 关键：直接借用 gateway 的网络环境
    stdin_open: true
    init: true
    tty: true
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /home/ubuntu/docker/openclaw/config:/home/node/.openclaw
      - /home/ubuntu/docker/openclaw/workspace:/home/node/.openclaw/workspace
    
    entrypoint: ["node", "dist/index.js"]

networks:
  network_default:
    external: true
    name: network_default
